[project]
name = "phishing-evaluator"
version = "0.1.0"
description = "A console application that uses Azure OpenAI GPT models to evaluate the likelihood of an email message to be a phishing attempt"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
phishing-evaluator = "phishing_evaluator.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
